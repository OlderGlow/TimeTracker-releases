name: Release

# Construit une version de TimeTracker à partir du code du dépôt privé OlderGlow/TimeTracker-Rust et la publie ici,
# avec latest.json lu par la mise à jour automatique. Lancé à la main (onglet Actions › Release › Run workflow).
# Dépôt public : les minutes GitHub Actions sont gratuites, et seul le propriétaire peut lancer ce workflow.
#
# Secrets du dépôt (Settings › Secrets and variables › Actions) :
# - SOURCE_TOKEN : jeton GitHub « fine-grained » limité à OlderGlow/TimeTracker-Rust, droit « Contents : lecture » ;
# - TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD : signature des mises à jour.
#
# Le code source n'est jamais publié : il est seulement récupéré sur la machine de build. Les avertissements du
# compilateur sont coupés (RUSTFLAGS -A warnings) pour que les journaux, publics, n'affichent pas d'extraits de code.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version à publier, sans le « v » (doit correspondre à tauri.conf.json et Cargo.toml)
        required: true
        type: string
      ref:
        description: Branche, tag ou commit du dépôt privé à construire
        required: true
        default: main
        type: string
      macos:
        description: Construire aussi l'installeur macOS
        type: boolean
        default: false
      linux:
        description: Construire aussi les installeurs Linux
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  GH_TOKEN: ${{ github.token }}
  TAG: v${{ inputs.version }}
  SOURCE_REPO: OlderGlow/TimeTracker-Rust

jobs:
  # Vérifie la version, rédige les notes depuis les PR fusionnées et crée un brouillon de Release, publié seulement
  # une fois les installeurs déposés. Un brouillon déjà créé par un lancement précédent est repris tel quel.
  draft:
    name: Brouillon
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Windows toujours ; macOS (un seul .dmg Intel et Apple Silicon) et Linux seulement si cochés au lancement.
      - name: Plateformes
        id: matrix
        env:
          MACOS: ${{ inputs.macos }}
          LINUX: ${{ inputs.linux }}
        run: |
          matrix=$(jq -cn --argjson macos "$MACOS" --argjson linux "$LINUX" '{include: (
            [{name: "Windows", os: "windows-latest", args: ""}]
            + (if $macos then [{name: "macOS", os: "macos-latest", args: "--target universal-apple-darwin"}] else [] end)
            + (if $linux then [{name: "Linux", os: "ubuntu-latest", args: ""}] else [] end)
          )}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[].name'

      - name: Secrets présents
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$SOURCE_TOKEN" ] || missing="$missing SOURCE_TOKEN"
          [ -n "$SIGNING_KEY" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          if [ -n "$missing" ]; then echo "::error::Secrets absents :$missing (Settings › Secrets and variables › Actions)."; exit 1; fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - name: La version demandée est celle du code
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ] || [ "$version" != "$cargo_version" ]; then
            echo "::error::Demandé $TAG, tauri.conf.json $version, Cargo.toml $cargo_version : les trois doivent correspondre."
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$draft" = false ]; then
            echo "::error::La version $TAG est déjà publiée dans ce dépôt."
            exit 1
          fi
          echo "existing=$draft" >> "$GITHUB_ENV"

      # Notes : le titre de chaque PR fusionnée depuis le commit de la version publiée précédente. Ce commit est noté en
      # fin de notes (« <!-- source: … --> ») ; à défaut, le tag de la version, s'il existe dans le dépôt privé.
      - name: Notes de version
        if: env.existing != 'true'
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          previous_body=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          previous=$(printf '%s' "$previous_body" | sed -n 's/.*<!-- source: \([0-9a-f]\{7,40\}\) -->.*/\1/p' | tail -1)
          [ -n "$previous" ] || previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          head=$(git rev-parse HEAD)
          titles=""
          if [ -n "$previous" ]; then
            if ! titles=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/compare/$previous...$head" --paginate \
              -q '.commits[].commit.message | select(startswith("Merge pull request")) | split("\n") | map(select(length > 0)) | .[1] // empty' 2>/dev/null); then
              echo "::warning::Comparaison impossible depuis $previous : notes sans liste des changements."
              titles=""
            fi
          fi
          {
            echo "## Nouveautés"
            echo
            if [ -n "$titles" ]; then printf '%s\n' "$titles" | sed 's/^/- /'; else echo "- Améliorations et corrections"; fi
            echo
            echo "<!-- source: $head -->"
          } > notes.md
          cat notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target main --title "TimeTracker $TAG" --notes-file notes.md

  build:
    name: Installeurs (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.draft.outputs.matrix) }}
    env:
      RUSTFLAGS: -A warnings
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev patchelf mold
          && echo "RUSTFLAGS=-A warnings -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Pas de cache Rust : un cache de ce dépôt public pourrait être relu par le workflow d'une pull request.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Dépendances de l'interface ; « tauri build » lance ensuite son build (beforeBuildCommand).
      - name: Dépendances de l'interface
        working-directory: ui
        run: npm ci --no-audit --no-fund

      # CLI Tauri précompilée (npm) : la compiler avec cargo prend 7 à 15 minutes.
      # Artefacts de mise à jour signés (.app.tar.gz, .AppImage, -setup.exe, .msi et leurs .sig).
      # Trois essais : l'empaquetage télécharge ses outils (WiX, NSIS, AppRun) depuis GitHub, qui répond parfois 504 ;
      # la compilation, déjà faite, n'est pas refaite aux essais suivants.
      - name: tauri build
        working-directory: src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            npx --yes @tauri-apps/cli@2 build --ci ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}' && exit 0
            [ "$attempt" = 3 ] || { echo "::warning::Empaquetage échoué (essai $attempt), nouvel essai dans 60 s."; sleep 60; }
          done
          exit 1

      - name: Déposer les installeurs
        shell: bash
        run: |
          # Archive macOS de mise à jour renommée avec la version (« TimeTracker.app.tar.gz » sinon).
          for f in $(find src-tauri/target -type f -path '*/release/bundle/macos/*.app.tar.gz*'); do
            mv "$f" "$(dirname "$f")/TimeTracker_${TAG#v}_universal${f##*/TimeTracker}"
          done
          find src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) > installers.txt
          sed 's#.*/##' installers.txt
          if [ ! -s installers.txt ]; then echo "::error::Aucun installeur produit."; exit 1; fi
          while IFS= read -r file; do gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber; done < installers.txt

  # Publie dès que l'installeur Windows est là (latest.json échoue sans lui) : macOS et Linux sont facultatifs, y compris
  # quand leur build échoue. Les fichiers déposés par un lancement précédent du même brouillon sont repris.
  publish:
    name: Publication
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les installeurs
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets

      # latest.json : version, notes et, par plateforme, l'adresse de l'installeur et sa signature.
      - name: Fichier de mise à jour (latest.json)
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          python3 - <<'PY'
          import glob, json, os, datetime, re
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          def entry(pattern, required=True):
              files = [f for f in glob.glob(f"assets/{pattern}") if not f.endswith(".sig")]
              if not files and not required:
                  print(f"::warning::Pas d'artefact {pattern} : plateforme absente de cette version.")
                  return None
              if len(files) != 1:
                  raise SystemExit(f"::error::Artefact de mise à jour introuvable ou ambigu : {pattern} -> {files}")
              name = os.path.basename(files[0])
              return {"signature": open(files[0] + ".sig").read().strip(), "url": base + name}
          mac = entry("*_universal.app.tar.gz", required=False)
          nsis = entry("*-setup.exe")
          msi = entry("*.msi")
          appimage = entry("*.AppImage", required=False)
          latest = {
              "version": tag.lstrip("v"),
              # Sans le repère « <!-- source: … --> », réservé au workflow.
              "notes": re.sub(r"\s*<!--.*?-->\s*", "\n", open("notes.md").read()).strip(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  **({"darwin-aarch64": mac, "darwin-x86_64": mac, "darwin-aarch64-app": mac, "darwin-x86_64-app": mac} if mac else {}),
                  "windows-x86_64": nsis, "windows-x86_64-nsis": nsis, "windows-x86_64-msi": msi,
                  **({"linux-x86_64": appimage, "linux-x86_64-appimage": appimage} if appimage else {}),
              },
          }
          json.dump(latest, open("latest.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps({**{k: v for k, v in latest.items() if k != "platforms"}, "platforms": list(latest["platforms"])}, ensure_ascii=False))
          PY

      - name: Publier la Release
        run: |
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
